<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Landed on its edge: Just Flip</title>
<link rel="icon" href="brand/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0818;
    --panel:#160F28;
    --panel-line:rgba(167,139,250,.28);
    --amber:#A78BFA;
    --amber-bright:#D8B4FE;
    --amber-dim:#4C2E8A;
    --text:#CBB6F5;
    --text-dim:#8A7CA8;
    --font-display:'Press Start 2P', ui-monospace, monospace;
    --font-body:'VT323', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    font-family:var(--font-body);
    font-size:19px;
    color:var(--text);
    background:
      radial-gradient(circle, rgba(167,139,250,.09) 1px, transparent 1.4px) 0 0/24px 24px,
      radial-gradient(ellipse 900px 500px at 50% 0%, #241242, transparent 60%),
      var(--ink);
  }
  .card{
    width:100%;
    max-width:420px;
    padding:30px 24px 26px;
    text-align:center;
    background:var(--panel);
    border:2px solid var(--panel-line);
  }
  .coin{
    width:104px;
    height:104px;
    margin:0 auto 22px;
    display:block;
    image-rendering:pixelated;
  }
  h1{
    margin:0 0 12px;
    font-family:var(--font-display);
    font-size:15px;
    line-height:1.7;
    color:var(--amber-bright);
  }
  p{margin:0 0 22px; line-height:1.5; color:var(--text-dim);}
  a.btn{
    display:inline-block;
    padding:14px 22px;
    font-family:var(--font-display);
    font-size:11px;
    letter-spacing:.04em;
    text-decoration:none;
    color:#160B2E;
    background:var(--amber-bright);
    border:2px solid var(--amber-dim);
  }
  a.btn:hover{background:var(--amber);}
  a.btn:focus-visible{outline:2px solid var(--amber-bright); outline-offset:3px;}
  .code{
    margin:20px 0 0;
    font-size:15px;
    letter-spacing:.22em;
    color:var(--amber-dim);
  }
</style>
</head>
<body>
  <main class="card">
    <!-- the split coin, same art the game uses, drawn rather than loaded -->
    <svg class="coin" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="9" y="0" width="8" height="1" fill="#FCCA07"/>
      <rect x="6" y="1" width="14" height="1" fill="#FCCA07"/>
      <rect x="4" y="2" width="18" height="2" fill="#FBB402"/>
      <rect x="2" y="4" width="22" height="8" fill="#FBB402"/>
      <rect x="2" y="12" width="22" height="6" fill="#DD6600"/>
      <rect x="4" y="18" width="18" height="3" fill="#CA5204"/>
      <rect x="6" y="21" width="14" height="2" fill="#CA5204"/>
      <rect x="9" y="23" width="8" height="1" fill="#CA5204"/>
      <rect x="12" y="0" width="1" height="24" fill="#230704"/>
      <rect x="13" y="0" width="13" height="0" fill="none"/>
      <rect x="5" y="8" width="2" height="9" fill="#230503"/>
      <rect x="9" y="8" width="2" height="9" fill="#230503"/>
      <rect x="7" y="12" width="2" height="2" fill="#230503"/>
      <rect x="15" y="8" width="6" height="2" fill="#131A22"/>
      <rect x="17" y="10" width="2" height="7" fill="#131A22"/>
    </svg>

    <h1>Landed on its edge</h1>
    <p>That page is not here. Nothing is broken, the coin just found a third side.</p>
    <a class="btn" href="/">Back to the game</a>
    <p class="code">ERROR 404</p>
  </main>
</body>
</html>
